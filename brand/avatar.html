<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:400px;height:400px;background:#050505;overflow:hidden}
body{display:grid;place-items:center;position:relative}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(216,216,210,.08),transparent 60%)}
body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
svg{width:300px;height:300px;position:relative}
.s{stroke:#d8d8d2;fill:none;stroke-width:2.2}
text{font-family:'JetBrains Mono',monospace;font-weight:300;fill:#d8d8d2;letter-spacing:6px}
</style></head><body>
<svg viewBox="0 0 300 300">
  <path class="s" d="M150 28 L272 240 L28 240 Z"/>
  <circle cx="150" cy="58" r="6" fill="#b3261e"/>
  <text x="152" y="196" font-size="58" text-anchor="middle">333</text>
</svg></body></html>
